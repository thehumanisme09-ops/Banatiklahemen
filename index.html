<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Sürpriz Sitesi</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #1e1b4b, #4c1d95, #7c3aed);
    font-family: 'Trebuchet MS', sans-serif;
    overflow: hidden;
  }
  .container {
    text-align: center;
  }
  h1 {
    color: white;
    font-size: 2em;
    margin-bottom: 30px;
    text-shadow: 0 0 10px rgba(255,255,255,0.5);
  }
  button {
    font-size: 1.5em;
    padding: 20px 50px;
    border: none;
    border-radius: 50px;
    background: linear-gradient(45deg, #f59e0b, #ef4444);
    color: white;
    cursor: pointer;
    box-shadow: 0 0 20px rgba(239,68,68,0.6);
    animation: pulse 1.5s infinite;
    transition: transform 0.2s;
  }
  button:hover {
    transform: scale(1.1);
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 10px rgba(239,68,68,0.6); }
    50% { box-shadow: 0 0 30px rgba(239,68,68,0.9); }
    100% { box-shadow: 0 0 10px rgba(239,68,68,0.6); }
  }
  #overlay {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: black;
    z-index: 999;
    align-items: center;
    justify-content: center;
    flex-direction: column;
  }
  #overlay img {
    max-width: 90%;
    max-height: 70%;
    border-radius: 20px;
    box-shadow: 0 0 60px #f59e0b;
    animation: pop 0.4s ease-out;
  }
  #overlay p {
    color: white;
    font-size: 2em;
    margin-top: 20px;
    animation: shake 0.5s infinite;
  }
  @keyframes pop {
    0% { transform: scale(0.1) rotate(-15deg); opacity: 0; }
    70% { transform: scale(1.15) rotate(5deg); opacity: 1; }
    100% { transform: scale(1) rotate(0deg); }
  }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-5px); }
    75% { transform: translateX(5px); }
  }
  .emoji {
    position: absolute;
    font-size: 2em;
    animation: fall linear infinite;
  }
  @keyframes fall {
    from { transform: translateY(-10vh) rotate(0deg); }
    to { transform: translateY(110vh) rotate(360deg); }
  }
  #closeBtn {
    margin-top: 25px;
    font-size: 1em;
    padding: 10px 25px;
    border-radius: 30px;
    border: 2px solid white;
    background: transparent;
    color: white;
    cursor: pointer;
  }
</style>
</head>

const mesajlar = [
  "😂 BUUU! ŞAŞIRDIN MI? 😂",
  "🤪 SÜRPRİZ! HADİ GÜL BAKALIM 🤪",
  "🎊 TEBRİKLER, KANDIRILDIN! 🎊"
];

function surpriz() {
  const overlay = document.getElementById('overlay');
  const img = document.getElementById('surprizImg');
  const mesaj = document.getElementById('mesaj');

  const i = Math.floor(Math.random() * gifler.length);
  img.src = gifler[i];
  mesaj.textContent = mesajlar[i];

  overlay.style.display = 'flex';

  // confetti / emoji yağmuru
  const confettiDiv = document.getElementById('confetti');
  confettiDiv.innerHTML = '';
  const emojiler = ['🎉','✨','🎊','😂','🤣','⭐'];
  for (let j = 0; j < 30; j++) {
    const span = document.createElement('span');
    span.className = 'emoji';
    span.textContent = emojiler[Math.floor(Math.random()*emojiler.length)];
    span.style.left = Math.random()*100 + 'vw';
    span.style.animationDuration = (Math.random()*2+2) + 's';
    span.style.animationDelay = (Math.random()*1) + 's';
    confettiDiv.appendChild(span);
  }

  // ses efekti (tarayıcı destekliyorsa)
  try {
    const audio = new Audio('data:audio/wav;base64,UklGRl9vT19XQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoAAAAAAA==');
    audio.volume = 0.2;
    audio.play().catch(()=>{});
  } catch(e) {}
}

function kapat() {
  document.getElementById('overlay').style.display = 'none';
}
